name: DualCamLive
options:
  bundleIdPrefix: com.example.dualcamlive
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  DualCamLive:
    type: application
    platform: iOS
    sources:
      - path: DualCamLive
        excludes:
          - App/Info.plist
    info:
      path: DualCamLive/App/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dualcamlive.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
