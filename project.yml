name: DualCam

options:
  bundleIdPrefix: app.dualcam
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  DualCam:
    type: application
    platform: iOS
    sources:
      - DualCam
    info:
      path: DualCam/Info.plist
      properties:
        CFBundleDisplayName: DualCam
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: 用于同时使用两颗摄像头拍照和录像
        NSMicrophoneUsageDescription: 用于录像时录制声音
        NSPhotoLibraryAddUsageDescription: 用于把照片和视频保存到相册
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dualcam.camera
