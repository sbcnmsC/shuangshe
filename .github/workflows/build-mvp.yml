name: Build MVP IPA

# 推送到 mvp 分支，或在 Actions 页面手动点「Run workflow」，都会自动编译并发布一个 Release。
on:
  push:
    branches: [mvp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (unsigned, for sideloading)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project DualCam.xcodeproj \
            -target DualCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "DualCam.app" | head -n 1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DualCam.ipa Payload
          ls -lh DualCam.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" DualCam.ipa \
            --repo "${{ github.repository }}" \
            --title "DualCam $TAG" \
            --notes "未签名 IPA（MVP 工程：双摄预览 + 画中画/分屏 + 倒计时拍照）。用 Sideloadly 签名后安装。提交：${{ github.sha }}" \
            --latest
