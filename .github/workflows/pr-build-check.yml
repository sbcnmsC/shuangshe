name: Pull Request Build Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project DualCam.xcodeproj \
            -scheme DualCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build
      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "DualCam.app" | head -n 1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DualCam-PR.ipa Payload
          ls -lh DualCam-PR.ipa
      - name: Upload candidate IPA
        uses: actions/upload-artifact@v4
        with:
          name: DualCam-PR-ipa
          path: DualCam-PR.ipa
          retention-days: 14
