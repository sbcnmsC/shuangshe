name: Build IPA

# 推送到 main 分支，或在 Actions 页面手动点「Run workflow」，都会自动编译并发布一个 Release。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, for sideloading)
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project DualCam.xcodeproj \
            -scheme DualCam \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name "DualCam.app" | head -n 1)
          echo "App bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DualCam.ipa Payload
          ls -lh DualCam.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualCam-ipa
          path: DualCam.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" DualCam.ipa \
            --repo "${{ github.repository }}" \
            --title "DualCam $TAG" \
            --notes "未签名 IPA，用 Sideloadly 或 AltStore 签名后安装到 iPhone。提交：${{ github.sha }}" \
            --latest
